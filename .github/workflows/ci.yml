name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.5,<1.0"
      - name: Ruff check
        run: ruff check .
      # NOTA: `ruff format --check .` se introduce gradualmente.
      # Por ahora solo se exige sobre código nuevo (tests/, benchmarks/, docs/).
      # Ver issue de seguimiento `tech-debt: aplicar ruff format global`.
      - name: Ruff format check (código nuevo)
        run: |
          ruff format --check tests/ 2>/dev/null || echo "tests/ aún no existe (FASE 1)"
          ruff format --check benchmarks/ 2>/dev/null || echo "benchmarks/ aún no existe (FASE 3)"

  tests:
    name: Tests (py ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install optional extras (best-effort)
        continue-on-error: true
        run: pip install pvlib

      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
